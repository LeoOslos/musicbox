<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0A09">
  <title>WiiM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Antes de pintar: si la última vez se eligió oscuro, arrancar oscuro.
    // Si va en app.js, la página aparece clara un instante y después salta.
    try {
      if (localStorage.getItem('wiim-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
</head>
<body>

    </svg>
    <div class="ambient-scrim"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">WiiM</span>
      <span class="brand-sep">/</span>
      <span id="dev-name" class="brand-device">—</span>
    </div>
    <div class="topbar-right">
      <div class="config-bar">
        <input id="ip-input" type="text" placeholder="192.168.1.x" aria-label="IP del equipo">
        <button id="btn-connect">Conectar</button>
      </div>
      <button id="btn-theme" class="theme-btn" title="Cambiar entre claro y oscuro" aria-label="Cambiar tema">
        <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
        </svg>
        <svg id="icon-sun" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
        </svg>
      </button>
      <button id="btn-cd-eject" class="eject-btn" title="Expulsar el disco / abrir la bandeja">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5.5 4.5 14h15zM4.5 16.5h15v2.2h-15z"/></svg>
        <span>Expulsar</span>
      </button>
      <span id="conn-status" class="badge disconnected">Desconectado</span>
    </div>
  </header>

  <main id="main" class="hidden">

    <!-- Stage: cover, what's playing, and the disc when there is one -->
    <section class="stage">

      <div class="cover-col">
        <div class="cover-frame">
          <!-- Dos capas: la saliente se congela abajo mientras la entrante decodifica,
               asi el marco nunca parpadea vacio y el cambio de tema es un fundido. -->
          <img id="artwork-prev" class="cover cover-prev hidden" src="" alt="" aria-hidden="true">
          <img id="artwork" src="" alt="" class="cover hidden">
          <div id="cover-empty" class="cover-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/>
            </svg>
            <span>Sin carátula</span>
          </div>
        </div>
      </div>

      <div class="now-col">
        <div class="now-tags">
          <span id="play-status" class="tag tag-status">—</span>
          <span id="source-chip" class="tag hidden"></span>
          <span id="cd-tag" class="tag tag-cd hidden">CD</span>
        </div>

        <h1 id="track-title" class="track-title">Nada sonando</h1>
        <p id="track-artist" class="track-artist"></p>
        <p id="track-album" class="track-album"></p>

        <div class="progress-wrap">
          <div class="progress-bar" id="progress-bar-click" role="slider" tabindex="0"
               aria-label="Posición del tema">
            <div id="progress-fill" class="progress-fill"></div>
            <!-- El knob va en un riel del ancho de la barra: translateX(p * 100%)
                 de si mismo = p * ancho de la barra, sin que lo aplaste el scaleX. -->
            <div id="progress-knob-rail" class="progress-knob-rail"><span class="progress-knob"></span></div>
          </div>
          <div class="progress-times">
            <span id="pos-label" class="mono">0:00</span>
            <span id="dur-label" class="mono">0:00</span>
          </div>
        </div>

        <div class="transport">
          <button id="btn-restart" class="ctrl" title="Volver al principio" aria-label="Volver al principio del tema">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12a8 8 0 1 1 2.6 5.9"/>
              <path d="M4 7.5V12h4.5"/>
            </svg>
          </button>
          <button id="btn-prev" class="ctrl" title="Anterior" aria-label="Anterior">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2.2v12H7zM19 6v12l-9-6z"/></svg>
          </button>
          <button id="btn-toggle" class="ctrl ctrl-play" title="Play / Pausa" aria-label="Play o pausa">
            <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 5.5h3.2v13H7.5zM13.3 5.5h3.2v13h-3.2z"/></svg>
          </button>
          <button id="btn-stop" class="ctrl" title="Detener" aria-label="Detener">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
          </button>
          <button id="btn-next" class="ctrl" title="Siguiente" aria-label="Siguiente">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.8 6H17v12h-2.2zM5 6l9 6-9 6z"/></svg>
          </button>
        </div>

        <div class="vol-row">
          <button id="btn-mute" class="mute-btn" title="Silenciar" aria-label="Silenciar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path class="wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path class="wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path class="mute-slash" d="M17 9l5 6M22 9l-5 6"/>
            </svg>
          </button>
          <input id="vol-slider" type="range" min="0" max="100" value="50" aria-label="Volumen">
          <span id="vol-label" class="mono vol-label">50</span>
        </div>

        <p class="kbd-hint">
          <kbd>espacio</kbd> play · <kbd>←</kbd><kbd>→</kbd> tema · <kbd>↑</kbd><kbd>↓</kbd> volumen
        </p>
      </div>

      <!-- Disc column: only takes room on screen when a disc is in the drive -->
      <aside class="disc-col" id="disc-col">
        <div class="disc-head">
          <div class="disc-titles">
            <span class="disc-label">Disco</span>
            <span id="cd-status" class="disc-name">—</span>
            <span id="cd-shape" class="disc-shape mono"></span>
          </div>
          <div class="disc-actions">
            <button id="btn-cd-identify" class="btn-ghost hidden" title="Buscar el nombre de los temas">Identificar</button>
          </div>
        </div>

        <div class="cd-identify-panel hidden" id="cd-identify-panel">
          <div class="cd-search-row">
            <input id="cd-search" type="text" placeholder="Buscar por álbum o artista">
            <button id="btn-cd-search" class="btn-ghost">Buscar</button>
          </div>
          <div class="cd-candidates" id="cd-candidates"></div>
        </div>

        <div class="cd-tracks" id="cd-tracks"></div>

        <p class="cd-hint" id="cd-hint">
          Con el equipo en silencio, <strong>▶</strong> arranca el disco; tocá un tema para ir a ese.
          Llega por la red, así que el WiiM queda en <strong>Wi-Fi</strong>.
        </p>
      </aside>

      <!-- Letra column: same slot pattern as the disc column, mutually exclusive
           with it (a CD in the tray keeps priority — see .has-disc vs .has-lyrics
           in app.js) so the stage never needs a fourth column. -->
      <aside class="lyrics-col" id="lyrics-col">
        <span class="disc-label">Letra</span>
        <div class="lyrics-body" id="lyrics-body">
          <p class="lyrics-empty">Sin letra para este tema</p>
        </div>
      </aside>

    </section>

    <!-- Set once and forgotten: behind tabs, closed by default -->
    <section class="settings">
      <nav class="tabs" role="tablist">
        <button class="tab" data-panel="source" role="tab">Fuente</button>
        <button class="tab" data-panel="eq" role="tab">Ecualizador</button>
        <button class="tab" data-panel="spotify" role="tab">Spotify</button>
        <button class="tab" data-panel="device" role="tab">Dispositivo</button>
      </nav>

      <div class="panel hidden" id="panel-source" role="tabpanel">
        <div class="source-grid">
          <button class="source-btn" data-source="wifi">Wi-Fi</button>
          <button class="source-btn" data-source="bluetooth">Bluetooth</button>
          <button class="source-btn" data-source="line-in">Line-In</button>
          <button class="source-btn" data-source="optical">Optical</button>
          <button class="source-btn" data-source="hdmi">HDMI</button>
        </div>
      </div>

      <div class="panel hidden" id="panel-eq" role="tabpanel">
        <div class="eq-row">
          <select id="eq-select" aria-label="Preset de ecualizador"><option value="">Cargando…</option></select>
          <button id="btn-eq-apply" class="btn-accent">Aplicar</button>
          <button id="btn-eq-flat" class="btn-ghost">Flat</button>
        </div>
        <div class="eq-bands" id="eq-bands"></div>
      </div>

      <div class="panel hidden" id="panel-spotify" role="tabpanel">
        <a id="spotify-login" class="btn-accent" href="/api/spotify/login">Conectar con Spotify</a>
        <div class="cd-search-row hidden" id="spotify-search-row">
          <input id="spotify-search" type="text" placeholder="Buscar canción o artista">
          <button id="btn-spotify-search" class="btn-ghost">Buscar</button>
        </div>
        <div class="cd-candidates" id="spotify-results"></div>
      </div>

      <div class="panel hidden" id="panel-device" role="tabpanel">
        <div id="device-details" class="device-details">—</div>
      </div>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
