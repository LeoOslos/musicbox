<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiiM Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>WiiM Dashboard</h1>
      <div class="config-bar">
        <input id="ip-input" type="text" placeholder="IP del WiiM (ej: 192.168.1.50)">
        <button id="btn-connect">Conectar</button>
        <span id="conn-status" class="badge disconnected">Desconectado</span>
      </div>
    </header>

    <main id="main" class="hidden">

      <!-- Now playing -->
      <section class="card now-playing">
        <img id="artwork" src="" alt="" class="artwork hidden">
        <div class="track-info">
          <div id="track-title" class="track-title">—</div>
          <div id="track-artist" class="track-artist">—</div>
          <div id="track-album" class="track-album"></div>
          <div class="progress-wrap">
            <div class="progress-bar">
              <div id="progress-fill" class="progress-fill" style="width:0%"></div>
            </div>
            <div class="progress-times">
              <span id="pos-label">0:00</span>
              <span id="dur-label">0:00</span>
            </div>
          </div>
        </div>
        <div id="play-status" class="play-status">—</div>
      </section>

      <!-- Playback controls -->
      <section class="card controls">
        <button id="btn-prev" title="Anterior">&#9664;&#9664;</button>
        <button id="btn-toggle" title="Play/Pause" class="btn-primary">&#9654;</button>
        <button id="btn-next" title="Siguiente">&#9654;&#9654;</button>
        <button id="btn-stop" title="Stop">&#9632;</button>
      </section>

      <!-- Volume -->
      <section class="card volume-section">
        <label>Volumen</label>
        <div class="vol-row">
          <button id="btn-mute" title="Mute">&#128263;</button>
          <input id="vol-slider" type="range" min="0" max="100" value="50">
          <span id="vol-label">50</span>
        </div>
      </section>

      <!-- Source -->
      <section class="card source-section">
        <label>Fuente</label>
        <div class="source-grid">
          <button class="source-btn" data-source="wifi">Wi-Fi</button>
          <button class="source-btn" data-source="bluetooth">Bluetooth</button>
          <button class="source-btn" data-source="line-in">Line-In</button>
          <button class="source-btn" data-source="optical">Optical</button>
          <button class="source-btn" data-source="hdmi">HDMI</button>
        </div>
      </section>

      <!-- EQ -->
      <section class="card eq-section">
        <label>Ecualizador</label>
        <div class="eq-row">
          <select id="eq-select"><option value="">Cargando...</option></select>
          <button id="btn-eq-apply">Aplicar</button>
        </div>
      </section>

      <!-- Device info -->
      <section class="card device-info">
        <label>Dispositivo</label>
        <div id="device-details" class="device-details">—</div>
      </section>

    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
