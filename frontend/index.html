<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiiM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <img id="bg-art" class="bg-art" src="" alt="">
  <div class="container">

    <header>
      <div class="brand">
        <span class="brand-dot"></span>WiiM
      </div>
      <div class="config-bar">
        <input id="ip-input" type="text" placeholder="192.168.1.x">
        <button id="btn-connect">Conectar</button>
        <span id="conn-status" class="badge disconnected">Desconectado</span>
      </div>
    </header>

    <main id="main" class="hidden">

      <!-- Now playing -->
      <section class="card now-playing">
        <img id="artwork" src="" alt="" class="artwork hidden">
        <div class="track-info">
          <div class="track-meta">
            <div id="track-title" class="track-title">—</div>
            <div id="track-artist" class="track-artist">—</div>
            <div id="track-album" class="track-album"></div>
          </div>
          <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar-click">
              <div id="progress-fill" class="progress-fill" style="width:0%"></div>
            </div>
            <div class="progress-times">
              <span id="pos-label">0:00</span>
              <span id="play-status">—</span>
              <span id="dur-label">0:00</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Controls -->
      <section class="card controls">
        <button id="btn-prev"   class="ctrl-sm"  title="Anterior">&#9664;&#9664;</button>
        <button id="btn-stop"   class="ctrl-sm"  title="Stop">&#9632;</button>
        <button id="btn-toggle" class="ctrl-play" title="Play/Pause">&#9654;</button>
        <button id="btn-next"   class="ctrl-sm"  title="Siguiente">&#9654;&#9654;</button>
      </section>

      <!-- Volume -->
      <section class="card volume-section">
        <span class="section-label">Volumen</span>
        <div class="vol-row">
          <button id="btn-mute" class="mute-btn" title="Mute">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
          </button>
          <input id="vol-slider" type="range" min="0" max="100" value="50">
          <span id="vol-label">50</span>
        </div>
      </section>

      <!-- Source -->
      <section class="card source-section">
        <span class="section-label">Fuente</span>
        <div class="source-grid">
          <button class="source-btn" data-source="wifi">Wi-Fi</button>
          <button class="source-btn" data-source="bluetooth">Bluetooth</button>
          <button class="source-btn" data-source="line-in">Line-In</button>
          <button class="source-btn" data-source="optical">Optical</button>
          <button class="source-btn" data-source="hdmi">HDMI</button>
        </div>
      </section>

      <!-- CD -->
      <section class="card cd-section">
        <div class="cd-head">
          <span class="section-label">CD</span>
          <span id="cd-status" class="cd-status">—</span>
          <button id="btn-cd-eject" class="cd-eject" title="Expulsar el disco">&#9167;</button>
        </div>
        <div class="cd-tracks" id="cd-tracks"></div>
        <p class="cd-hint">Tocá un tema para empezar; los botones de arriba manejan el disco.
          Llega por la red, así que el WiiM queda en <strong>Wi-Fi</strong> solo.</p>
      </section>

      <!-- EQ -->
      <section class="card eq-section">
        <span class="section-label">Ecualizador</span>
        <div class="eq-row">
          <select id="eq-select"><option value="">Cargando…</option></select>
          <button id="btn-eq-apply" class="btn-amber-outline">Aplicar</button>
          <button id="btn-eq-flat" class="btn-ghost">Flat</button>
        </div>
        <div class="eq-bands" id="eq-bands"></div>
      </section>

      <!-- Device info -->
      <section class="card device-info">
        <span class="section-label">Dispositivo</span>
        <div id="device-details" class="device-details">—</div>
      </section>

    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
